      OnDemandThroughput:
        MaxReadRequestUnits: 1
        MaxWriteRequestUnits: 4
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: archiveDate
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: archiveDate
          KeyType: RANGE
  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - UseDefaultBucketName
        - !Sub "fiscus-files-${AWS::AccountId}-${AWS::Region}"
        - !Ref BucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BlockedEncryptionTypes:
              EncryptionType:
                - SSE-C
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: shared handler helpers (fiscus package)
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64

  OpenpyxlLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      Description: openpyxl for the report functions
      ContentUri: layers/openpyxl/
      CompatibleRuntimes:
        - python3.14
      CompatibleArchitectures:
        - arm64
    Metadata:
      BuildMethod: python3.14

  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      OpenApiVersion: "3.0.1"
      EndpointConfiguration:
        Type: REGIONAL
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 25
          ThrottlingRateLimit: 25
          MetricsEnabled: false
          DataTraceEnabled: false
      DefinitionBody:
        Fn::Transform:
          Name: AWS::Include
          Parameters:
            Location: openapi.yaml

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      ApiStages:
        - ApiId: !Ref Api
          Stage: !Ref Api.Stage
      Throttle:
        BurstLimit: 100
        RateLimit: 25
      Quota:
        Limit: 5000
        Period: DAY

  StarterApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Description: Starter API key created with the stack
      Enabled: true

  StarterUsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref StarterApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  CreateIncomeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/incomes/
      Handler: CreateIncome.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IncomesTable

  DeleteIncomeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/incomes/
      Handler: DeleteIncome.lambda_handler
