# Generated by scripts/gen_api.py from api/. Do not edit by hand.
AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Fiscus accounting app backend

Parameters:
  TableNamePrefix:
    Type: String
    Default: ""
    Description: Prefix for every DynamoDB table name. Leave empty for production; use e.g. "test-" for a test stack.
  BucketName:
    Type: String
    Default: ""
    Description: Name of the files bucket. Leave empty to use fiscus-files-<account id>-<region>.

Conditions:
  UseDefaultBucketName: !Equals [!Ref BucketName, ""]

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64
    MemorySize: 128
    EphemeralStorage:
      Size: 512
    Timeout: 5
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        TABLE_INCOMES: !Ref IncomesTable
        TABLE_EXPENSES: !Ref ExpensesTable
        TABLE_CAR_EXPENSES: !Ref CarExpensesTable
        TABLE_HOUSE_EXPENSES: !Ref HouseExpensesTable
        TABLE_TRAVEL_LOGS: !Ref TravelLogsTable
        TABLE_MISC_FILES: !Ref MiscFilesTable
        TABLE_ARCHIVE_INCOMES: !Ref ArchiveIncomesTable
        TABLE_ARCHIVE_EXPENSES: !Ref ArchiveExpensesTable
        TABLE_ARCHIVE_CAR_EXPENSES: !Ref ArchiveCarExpensesTable
        TABLE_ARCHIVE_HOUSE_EXPENSES: !Ref ArchiveHouseExpensesTable
        BUCKET_NAME: !Ref FilesBucket

Resources:
  IncomesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${TableNamePrefix}Incomes"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      DeletionProtectionEnabled: true
      OnDemandThroughput:
        MaxReadRequestUnits: 10
        MaxWriteRequestUnits: 10
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: invoiceDate
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: invoiceDate
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: userId-invoiceDate-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: invoiceDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          OnDemandThroughput:
            MaxReadRequestUnits: 10
            MaxWriteRequestUnits: 10

  ExpensesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${TableNamePrefix}Expenses"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      DeletionProtectionEnabled: true
      OnDemandThroughput:
        MaxReadRequestUnits: 10
        MaxWriteRequestUnits: 10
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: invoiceDate
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: invoiceDate
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: userId-invoiceDate-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: invoiceDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          OnDemandThroughput:
            MaxReadRequestUnits: 10
            MaxWriteRequestUnits: 10

  CarExpensesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${TableNamePrefix}CarExpenses"
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      DeletionProtectionEnabled: true
      OnDemandThroughput:
        MaxReadRequestUnits: 10
        MaxWriteRequestUnits: 10
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: invoiceDate
          AttributeType: S
        - AttributeName: carId
