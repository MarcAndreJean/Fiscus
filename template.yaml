      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD_INFREQUENT_ACCESS
      DeletionProtectionEnabled: true
      OnDemandThroughput:
        MaxReadRequestUnits: 4
        MaxWriteRequestUnits: 4
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: archiveDate
          AttributeType: S
      KeySchema:
